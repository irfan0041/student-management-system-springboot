<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="card login-card" style="width: 100%; max-width: 420px;">

    <!-- Header -->
    <div class="login-header text-center text-white">
        <h2 class="mb-1 fw-bold">
            <i class="bi bi-mortarboard-fill me-2"></i>Irfan
        </h2>

        <p class="mb-0 opacity-75">
            Student Management System
        </p>
    </div>


    <!-- Login Body -->
    <div class="card-body p-4 p-md-5">

        <h4 class="text-center mb-4 fw-bold text-dark">
            Welcome Back
        </h4>


        <!-- Login Error -->
        <div th:if="${param.error}"
             class="alert alert-danger text-center"
             role="alert">
            Invalid username or password. Please try again.
        </div>


        <!-- Logout Message -->
        <div th:if="${param.logout}"
             class="alert alert-success text-center">
            You have been logged out successfully.
        </div>


        <!-- Custom Message -->
        <div th:if="${message}"
             class="alert alert-danger text-center"
             role="alert"
             th:text="${message}">
        </div>


        <!-- Login Form -->
        <form th:action="@{/login}"
              method="post"
              id="loginForm">


            <!-- CSRF Token -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>


            <!-- Username -->
            <div class="mb-4">
                <label for="username"
                       class="form-label text-muted small fw-bold">
                    USERNAME
                </label>

                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>

                    <input type="text"
                           class="form-control border-start-0 ps-0"
                           id="username"
                           name="username"
                           placeholder="Enter your username"
                           required>
                </div>
            </div>


            <!-- Password -->
            <div class="mb-4">
                <label for="password"
                       class="form-label text-muted small fw-bold">
                    PASSWORD
                </label>

                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>

                    <input type="password"
                           class="form-control border-start-0 ps-0"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>
            </div>


            <!-- Normal Login Button -->
            <div class="d-grid">
                <button type="submit"
                        class="btn btn-primary py-2 fs-6">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login
                </button>
            </div>


            <!-- Divider -->
            <div class="text-center my-3">
                <span class="text-muted small">
                    OR
                </span>
            </div>


            <!-- Demo Account -->
            <div class="text-center">
                <p class="text-muted small mb-2">
                    Want to explore the system?
                </p>

                <button type="button"
                        class="btn btn-outline-primary w-100 py-2"
                        onclick="demoLogin()">
                    <i class="bi bi-play-circle me-2"></i>
                    Try Demo Account
                </button>
            </div>

        </form>

    </div>

</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Demo Login Logic -->
<script>
    function demoLogin() {
        // Backend DataInitializer la set panna exact credentials
        document.getElementById("username").value = "Admin";
        document.getElementById("password").value = "admin@123";

        // Form direct ah submit aagum (CSRF token sernthu pogum)
        document.getElementById("loginForm").submit();
    }
</script>

</body>

</html>
